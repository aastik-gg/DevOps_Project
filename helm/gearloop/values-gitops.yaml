# Values used by Argo CD (see gitops/ and terraform/argocd.tf).
# CI rewrites the two image tags below on every push to main; Argo CD sees the
# commit and rolls the cluster to that exact image. Do not edit the tags by hand.
backend:
  image:
    repository: ghcr.io/aastik-gg/gearloop-backend
    tag: "2e15369000368d7d1457f83c9d11306afcc6b298"
    pullPolicy: IfNotPresent
frontend:
  image:
    repository: ghcr.io/aastik-gg/gearloop-frontend
    tag: "2e15369000368d7d1457f83c9d11306afcc6b298"
    pullPolicy: IfNotPresent
postgres:
  existingSecret: gearloop-db # created by Terraform; never stored in Git
ingress:
  host: gearloop.local
monitoring:
  serviceMonitor: {enabled: true}
  prometheusRule: {enabled: true}
  grafanaDashboard: {enabled: true}
