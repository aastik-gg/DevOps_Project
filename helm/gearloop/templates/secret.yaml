{{- $password := include "gearloop.dbPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gearloop.dbSecret" . }}
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
  annotations:
    # The migration hook Job runs before upgrades and needs this Secret to exist.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | quote }}
  {{- if .Values.postgres.enabled }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username $password (include "gearloop.postgresHost" .) .Values.postgres.database | quote }}
  {{- else }}
  database-url: {{ required "postgres.externalUrl is required when postgres.enabled=false" .Values.postgres.externalUrl | quote }}
  {{- end }}
