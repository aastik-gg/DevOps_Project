{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gearloop.fullname" . }}
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: gearloop.rules
      rules:
        - alert: GearLoopBackendDown
          expr: absent(up{job="{{ include "gearloop.fullname" . }}-backend"} == 1)
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: No GearLoop backend pod is being scraped successfully
        - alert: GearLoopHigh5xxRate
          expr: |
            sum(rate(http_requests_total{job="{{ include "gearloop.fullname" . }}-backend", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{job="{{ include "gearloop.fullname" . }}-backend"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: More than 5% of GearLoop API requests are failing
        - alert: GearLoopSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="{{ include "gearloop.fullname" . }}-backend"}[5m]))) > 0.5
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: GearLoop API p95 latency is above 500ms
        - alert: GearLoopOverdueEquipment
          expr: max(gearloop_items{status="OVERDUE"}) > 0
          for: 1h
          labels: {severity: info}
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} item(s) are overdue for return"
{{- end }}
