apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gearloop.fullname" . }}-test-api
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- include "gearloop.podSecurityContext" . | nindent 4 }}
    runAsUser: 65534
  containers:
    - name: smoke
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          base=http://{{ include "gearloop.fullname" . }}-backend:8000
          ui=http://{{ include "gearloop.fullname" . }}-frontend
          # Retry with short timeouts: right after a rollout an endpoint can briefly point at a terminating pod.
          check() {
            for i in 1 2 3 4 5 6; do
              wget -T 5 -qO- "$1" | grep -qi "$2" && { echo "ok   $1"; return 0; }
              sleep 3
            done
            echo "FAIL $1 (expected '$2')"; return 1
          }
          check "$base/ready" READY &&
          check "$base/api/stats" total_items &&
          check "$ui/" gearloop &&
          check "$ui/api/stats" total_items
      securityContext:
        {{- include "gearloop.containerSecurityContext" . | nindent 8 }}
