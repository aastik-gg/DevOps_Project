{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gearloop.fullname" . }}-migrate
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # post-install: Postgres is part of this release, so it must exist first.
    # pre-upgrade: schema moves forward before new backend pods roll out.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "gearloop.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gearloop.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "gearloop.image" (dict "ctx" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for database..."
              until python -c "from app.db import engine; engine.connect().close()" 2>/dev/null; do sleep 2; done
              alembic upgrade head
              {{- if .Values.migrations.seedDemoData }}
              python -m app.seed
              {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "gearloop.dbSecret" . }}, key: database-url}}
          securityContext:
            {{- include "gearloop.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
