# Scenario 3: pods are Running but never become Ready; the app returns 503 on /ready.
apiVersion: v1
kind: Secret
metadata:
  name: gearloop-db-staging
  namespace: gearloop
  labels: {lab: troubleshooting}
stringData:
  database-url: postgresql+psycopg://gearloop:wrong-password@gearloop-postgres:5432/gearloop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearloop-staging-api
  namespace: gearloop
  labels: {lab: troubleshooting}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gearloop-staging-api}
  template:
    metadata:
      labels:
        app: gearloop-staging-api
        # Allowed through the Postgres NetworkPolicy so the failure is the password, not the network.
        gearloop.io/db-client: "true"
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: gearloop-backend:local   # on a remote cluster use ghcr.io/<owner>/gearloop-backend:<sha>
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: gearloop-db-staging, key: database-url}}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 200m, memory: 256Mi}
